apply plugin: 'net.neoforged.moddev'

// The Create Cosmonautics adapter (SPACE-012): inside ZAS³'s zones, and wherever ZAS³'s internals
// give a breath, Cosmonautics' "can't breathe" in space gives way to ZAS³'s verdict. The adapter
// listens to NeoForge's breathing event and names nothing of Cosmonautics', so it compiles against
// no other mod. Its classes ship inside the zas jar (zas/build.gradle's `bundled`), and zas starts
// it only when Cosmonautics is installed in a version its row supports (COMPAT-001, COMPAT-002).
// None of it needs the content. Cosmonautics, Aeronautics, Sable and Create are never in a jar of
// ours: they are added to this project's own run alone.

// What a run of the GameTests loads: the newest Cosmonautics by default, the oldest the adapter
// supports with -Pcosmonautics.version=floor, or the last one before it with
// -Pcosmonautics.version=unsupported. Each runs with the Aeronautics, Sable and Create the
// Aeronautics adapter's newest run uses. The versions are in gradle.properties.
def table = [
    newest     : [version: cosmonautics_version, supported: true],
    floor      : [version: cosmonautics_floor_version, supported: true],
    unsupported: [version: cosmonautics_unsupported_version, supported: false],
]
def runName = providers.gradleProperty('cosmonautics.version').getOrElse('newest')
def chosen = table[runName]
if (chosen == null) {
    throw new GradleException("-Pcosmonautics.version is one of ${table.keySet().join(', ')}, not '${runName}'")
}
// The tests of a Cosmonautics the adapter supports, or the one that checks it stays off. The ones
// that need the content mod's mask and tank are in a namespace of their own, which -Pcontent=off
// leaves out (CONT-155).
def namespaces = !chosen.supported ? ['zas_cosmonautics_off']
        : contentOff ? ['zas_cosmonautics'] : ['zas_cosmonautics', 'zas_cosmonautics_content']

repositories {
    // Cosmonautics, Aeronautics, Sable and Create come from Modrinth's maven, as a player downloads
    // them. Cosmonautics nests Dimensional Sable.
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    // The adapter's GameTests, which run with Cosmonautics loaded (COMPAT-004). They stay out of
    // every jar but the one their own run loads.
    gametest {
        compileClasspath += main.output + main.compileClasspath
    }
    // That run's classpath, empty on purpose: zas and zas_atmos come in as the release jar, as a
    // player has them, so the tests also show that the jar holds the adapter and that zas starts it.
    gametestRun
}

configurations {
    releaseJar {
        canBeConsumed = false
        transitive = false
    }
}

// The GameTests' empty structure in each of their namespaces, copied from the framework's so no
// second binary is kept here.
def emptyStructures = tasks.register('copyEmptyStructures', Sync) {
    ['zas_cosmonautics', 'zas_cosmonautics_content', 'zas_cosmonautics_off'].each { ns ->
        from(project(':zas').file('src/gametest/resources/data/zas/structure/empty.nbt')) {
            into "data/${ns}/structure"
        }
    }
    into layout.buildDirectory.dir('generated/emptyStructures')
}
sourceSets.gametest.resources.srcDir(emptyStructures)

dependencies {
    implementation project(':zas-api')
    // ZAS³'s internals: each entity's last breathing verdict and the local player's, which the
    // public API answers only by assessing again. zas ships this adapter, so it never compiles
    // against it: it only runs with it.
    compileOnly project(':zas')
    compileOnly project(':engine')

    gametestCompileOnly project(':zas')
    // zas's adapter table, which the tests ask, is SS13 Framework's Adapters.
    gametestCompileOnly "io.github.west3436:ss13-framework:${framework_version}"
    gametestCompileOnly project(':engine')

    releaseJar project(':dist')
}

neoForge {
    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.gametestRun)
    runs {
        // Not named gameTestServer: the main CI runs every project's runGameTestServer, and this
        // one needs Cosmonautics, which that build never downloads to run.
        adapterGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametestRun
            loadedMods = []
            gameDirectory = layout.buildDirectory.dir('adapterRun')
            systemProperty 'neoforge.enabledGameTestNamespaces', namespaces.join(',')
            // The Cosmonautics the run asked for, which the tests check is the one that loaded.
            systemProperty 'zas.cosmonautics.version', chosen.version
            jvmArgument '-Xmx4G'
            jvmArgument '-XX:+ExitOnOutOfMemoryError'
        }
    }
}

// The release jar plus the tests and their data.
def adapterTestJar = tasks.register('adapterTestJar', Jar) {
    archiveClassifier = 'adapter-test'
    dependsOn configurations.releaseJar
    inputs.files(configurations.releaseJar)
    from({ configurations.releaseJar.collect { zipTree(it) } })
    from sourceSets.gametest.output
}

dependencies {
    gametestRunRuntimeOnly files(adapterTestJar)
    gametestRunRuntimeOnly("maven.modrinth:create-cosmonatics:${chosen.version}") { transitive = false }
    gametestRunRuntimeOnly("maven.modrinth:create-aeronautics:${aeronautics_version}") { transitive = false }
    gametestRunRuntimeOnly("maven.modrinth:sable:${aeronautics_sable_version}") { transitive = false }
    gametestRunRuntimeOnly("maven.modrinth:create:${create_version}") { transitive = false }
}

// The tests start from a fresh world, as zas's do: saved zones would otherwise come back.
tasks.matching { it.name == 'runAdapterGameTestServer' }.configureEach {
    doFirst {
        delete layout.buildDirectory.dir('adapterRun/world')
        delete layout.buildDirectory.dir('adapterRun/logs')
    }
}
