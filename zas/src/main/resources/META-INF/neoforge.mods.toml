modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/west3436/zas-cubed/issues"

[[mods]]
modId = "zas"
version = "${mod_version}"
displayName = "ZAS³"
logoFile = "assets/zas/logo.png"
authors = "west3436"
description = '''
Zone-based atmospherics: sealed spaces hold real gas mixtures that equalize,
vent, burn and conduct heat. Provides the shared atmosphere API.
'''

[[mixins]]
config = "zas.mixins.json"

# The Mekanism adapter's hooks (MEK-001): only with Mekanism installed, and its own plugin then
# applies them only to a version the adapter supports. No dependency entry names Mekanism, so no
# version of it can stop the game.
[[mixins]]
config = "zas.mekanism.mixins.json"
requiredMods = ["mekanism"]

[[dependencies.zas]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.zas]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"
