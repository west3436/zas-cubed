apply plugin: 'net.neoforged.moddev'

base { archivesName = 'zas' }

evaluationDependsOn(':engine')
evaluationDependsOn(':compat-adastra')
evaluationDependsOn(':compat-mekanism')
evaluationDependsOn(':compat-jei')
evaluationDependsOn(':compat-emi')

// GameTests live in their own source set so they stay out of the mod jar.
sourceSets {
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

// Source sets compiled elsewhere whose classes ship inside the zas jar. The viewer plugins compile
// against zas, so zas only runs with them: it never compiles against them.
def viewers = [project(':compat-jei'), project(':compat-emi')]
def bundled = ([project(':engine'), project(':compat-adastra'), project(':compat-mekanism')] + viewers)
        .collect { it.sourceSets.main }

neoForge {
    runs {
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'zas'
            // The same heap everywhere, so a local run can't hide what CI runs out of. Chunks wait
            // in memory to be written, so a slow disk needs more of it. An OOM ends the run at once
            // rather than at CI's time limit.
            jvmArgument '-Xmx6G'
            jvmArgument '-XX:+ExitOnOutOfMemoryError'
        }
    }
    mods {
        // The API is never listed: it loads as its own GAMELIBRARY module, and
        // listing it splits its package across two modules (architecture §2.1).
        zas {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
            bundled.each { sourceSet it }
        }
    }
}

// GameTests start from a fresh world: the atmosphere is saved with the chunks (DATA-002), so a
// world left by an earlier run would bring its zones back into the tests' areas.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete layout.projectDirectory.dir('run/world')
    }
}

// Unit tests of the mod's pure logic, such as datapack formats (FIRE-001). Minecraft's classes are
// on the test classpath, but the game is never bootstrapped.
neoForge {
    addModdingDependenciesTo(sourceSets.test)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The shipped datapack, which tests read as files.
    systemProperty 'zas.resources', file('src/main/resources').absolutePath
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation project(':engine')
    implementation project(':compat-adastra')
    implementation project(':zas-api')
    // Started by name (Adapters), so zas never compiles against it.
    runtimeOnly project(':compat-mekanism')
    viewers.each { runtimeOnly it }

    // ModDevGradle takes the jar-in-jar range only from a module selector, so
    // the API is requested by coordinates and substituted with the project.
    jarJar('io.github.west3436:zas-api') {
        version {
            strictly api_range
            prefer api_version
        }
    }
}

configurations.named('jarJar') {
    resolutionStrategy.dependencySubstitution {
        substitute module('io.github.west3436:zas-api') using project(':zas-api')
    }
}

tasks.named('jar', Jar) {
    bundled.each { from it.output }
}
