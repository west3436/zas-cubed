apply plugin: 'net.neoforged.moddev'

base { archivesName = 'zas' }

evaluationDependsOn(':engine')
evaluationDependsOn(':compat-adastra')
evaluationDependsOn(':compat-mekanism')
evaluationDependsOn(':compat-slots')
evaluationDependsOn(':compat-kubejs')
evaluationDependsOn(':compat-jei')
evaluationDependsOn(':compat-emi')
evaluationDependsOn(':compat-pneumaticcraft')
evaluationDependsOn(':compat-nuclearcraft')
evaluationDependsOn(':compat-mi')
evaluationDependsOn(':compat-ae2')
evaluationDependsOn(':compat-aeronautics')
evaluationDependsOn(':compat-sable')
evaluationDependsOn(':compat-cosmonautics')
evaluationDependsOn(':compat-northstar')

// GameTests live in their own source set so they stay out of the mod jar.
sourceSets {
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

// Source sets compiled elsewhere whose classes ship inside the zas jar. The viewer plugins and the
// KubeJS plugin compile against zas, so zas only runs with them: it never compiles against them. So
// does the AE2 adapter, which names gases and draws them as the viewers do, the Aeronautics
// adapter, which reads each dimension's ambient, the Sable adapter, which saves and drops the
// chunks Sable keeps itself, the Cosmonautics adapter, which reads each entity's last breathing
// verdict, and the Northstar adapter, which reads each dimension's published zones.
def viewers = [project(':compat-jei'), project(':compat-emi')]
def onZas = viewers + [project(':compat-ae2'), project(':compat-aeronautics'), project(':compat-sable'),
                       project(':compat-cosmonautics'), project(':compat-northstar')]
def bundled = ([project(':engine'), project(':compat-adastra'), project(':compat-mekanism'), project(':compat-slots'),
                project(':compat-kubejs'), project(':compat-pneumaticcraft'), project(':compat-nuclearcraft'),
                project(':compat-mi')]
        + onZas)
        .collect { it.sourceSets.main }

neoForge {
    runs {
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'zas'
            // The same heap everywhere, so a local run can't hide what CI runs out of. Chunks wait
            // in memory to be written, so a slow disk needs more of it. An OOM ends the run at once
            // rather than at CI's time limit.
            jvmArgument '-Xmx6G'
            jvmArgument '-XX:+ExitOnOutOfMemoryError'
        }
    }
    mods {
        // The API is never listed: it loads as its own GAMELIBRARY module, and
        // listing it splits its package across two modules (architecture §2.1).
        zas {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
            bundled.each { sourceSet it }
        }
    }
}

// GameTests start from a fresh world: the atmosphere is saved with the chunks (DATA-002), so a
// world left by an earlier run would bring its zones back into the tests' areas.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete layout.projectDirectory.dir('run/world')
    }
}

// Unit tests of the mod's pure logic, such as datapack formats (FIRE-001). Minecraft's classes are
// on the test classpath, but the game is never bootstrapped.
neoForge {
    addModdingDependenciesTo(sourceSets.test)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The shipped datapack, which tests read as files.
    systemProperty 'zas.resources', file('src/main/resources').absolutePath
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation project(':engine')
    implementation project(':compat-adastra')
    implementation project(':zas-api')
    // Started by name (ZasAdapters), so zas never compiles against them.
    runtimeOnly project(':compat-mekanism')
    runtimeOnly project(':compat-slots')
    runtimeOnly project(':compat-pneumaticcraft')
    runtimeOnly project(':compat-nuclearcraft')
    runtimeOnly project(':compat-mi')
    // Found by KubeJS, through the kubejs.plugins.txt that ships with it.
    runtimeOnly project(':compat-kubejs')
    onZas.each { runtimeOnly it }

    // SS13 Framework, the mod and its API, which zas and zas_atmos compile against (CONT-095). Dev
    // runs load the mod's jar, which nests the API: the API is never on a run's classpath by itself,
    // since a second copy would be a second module of the same name. Unit tests aren't a game, so
    // they take both jars.
    compileOnly "io.github.west3436:ss13-framework:${framework_version}"
    runtimeOnly("io.github.west3436:ss13-framework:${framework_version}") { transitive = false }
    testImplementation "io.github.west3436:ss13-framework:${framework_version}"

    // ModDevGradle takes the jar-in-jar range only from a module selector, so
    // the API is requested by coordinates and substituted with the project.
    jarJar('io.github.west3436:zas-api') {
        version {
            strictly api_range
            prefer api_version
        }
    }

    // SS13 Framework, the mod and its API, nested as the framework's README says, so the release
    // jar carries them and players never install them. The mod nests the API too, but naming the API
    // here makes its range zas's own.
    jarJar('io.github.west3436:ss13-framework') {
        transitive = false
        version {
            strictly framework_range
            prefer framework_version
        }
    }
    jarJar('io.github.west3436:ss13-framework-api') {
        version {
            strictly framework_range
            prefer framework_version
        }
    }
}

configurations.named('jarJar') {
    resolutionStrategy.dependencySubstitution {
        substitute module('io.github.west3436:zas-api') using project(':zas-api')
    }
}

tasks.named('jar', Jar) {
    bundled.each { from it.output }
}
