apply plugin: 'net.neoforged.moddev'
// SS13 Framework's plugin for an API jar. It makes the jar a GAMELIBRARY whose
// Automatic-Module-Name is apiPackage, and adds the checks that check runs:
// checkApiPackages (API-001: nothing outside io.github.west3436.zas.api and its
// subpackages, plus META-INF), checkApiDependencies (API-003, API-044: no
// dependency but Minecraft and NeoForge), javadoc that fails on a broken or
// missing comment (API-004, API-005, API-008), and apiCompat, the
// binary-compatibility check (API-043, NFR-033). It publishes the jar to Maven
// Central with its sources and javadoc jars (API-008, D-18).
apply plugin: 'io.github.west3436.ss13.api'

ss13 { apiPackage = 'io.github.west3436.zas.api' }

// Independent semver (API-002), 1.x from R1 on (API-041). It loads as its own
// GAMELIBRARY module in dev and production, so no mod lists this project's
// source set (architecture §2.1).
//
// -PapiSnapshot=true (or ORG_GRADLE_PROJECT_apiSnapshot=true) builds
// <api_version>-SNAPSHOT for the Central snapshots repository. The mods' nested
// API keeps its range, from api_version up to the next major, either way.
def snapshot = providers.gradleProperty('apiSnapshot').getOrElse('false').toBoolean()
version = snapshot ? "${api_version}-SNAPSHOT" : api_version

// Unit tests of the API's pure logic. Minecraft's classes are on the test
// classpath, but the game is never bootstrapped.
neoForge {
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // ApiReferencesTest scans the compiled API classes (API-003, API-044).
    def classes = sourceSets.main.output.classesDirs
    inputs.files(classes).withPropertyName('apiClasses')
    systemProperty 'zas.api.classes', classes.files.join(File.pathSeparator)
}

// Maven Central through the Sonatype Central Portal (API-008, D-18), as
// io.github.west3436:zas-api. A -SNAPSHOT version goes to
// https://central.sonatype.com/repository/maven-snapshots/; a release becomes a
// Portal deployment. Credentials come from the mavenCentralUsername and
// mavenCentralPassword Gradle properties (a Portal user token), and the build
// signs whenever signingInMemoryKey is set. The archived API guide has the details:
// https://github.com/west3436/zas-cubed/blob/128e69fe9056e122f5cc8b095d8cca84e51592e4/docs/api-consumers.md#publishing-maintainers
//
// apiCompat compares this jar with the released API that api_baseline_version,
// api_baseline_tag and api_baseline_sha256 in gradle.properties name: the jar on
// that GitHub release, refused unless its SHA-256 matches. A binary-incompatible
// change needs a new major version, and from 1.0 even a new major can't remove
// what the baseline didn't mark @Deprecated (API-042). -Papi_baseline_repo=<url
// or path> takes the baseline from a Maven repository instead. The version
// policy is in the archived API guide:
// https://github.com/west3436/zas-cubed/blob/128e69fe9056e122f5cc8b095d8cca84e51592e4/docs/api-consumers.md#versioning-and-the-compatibility-check
mavenPublishing {
    pom {
        name = 'ZAS³ API'
        description = 'The public API of ZAS³, zone-based atmospherics for NeoForge. ' +
                'Mods may bundle it (jar-in-jar) and call it whether or not ZAS³ is installed.'
    }
}
