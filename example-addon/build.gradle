apply plugin: 'net.neoforged.moddev'

// A consumer of the API alone, never published. CI runs it with and without
// zas (API-048, S-12). It nests the API the way the developer docs tell
// consumers to.
base { archivesName = 'zas_example' }

// GameTests live in their own source set so they stay out of the addon jar.
sourceSets {
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
    // API-007: tests that run inside a built copy of this addon, beside zas's
    // built jar.
    oneCopy {
        compileClasspath += main.output + main.compileClasspath
        resources.srcDir 'src/gametest/resources'
    }
    // That run's classpath, empty on purpose: the only API on it is what the two
    // jars nest, so FML's jar-in-jar locator chooses, as in production.
    oneCopyRun
}

neoForge {
    addModdingDependenciesTo(sourceSets.oneCopyRun)
    runs {
        oneCopyGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.oneCopyRun
            loadedMods = []
            gameDirectory = layout.buildDirectory.dir('oneCopyRun')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'zas_example'
        }
        // S-12 (API-048): a GameTest server with the addon and the API only.
        // zas is never on this classpath, so the API's fallback answers.
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'zas_example'
        }
    }
    mods {
        // As in zas, the API is never listed: it loads as its own GAMELIBRARY
        // module (architecture §2.1).
        zas_example {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

dependencies {
    implementation project(':zas-api')
    jarJar('io.github.west3436:zas-api') {
        version {
            strictly "[${api_version},1.0)"
            prefer api_version
        }
    }
}

configurations.named('jarJar') {
    resolutionStrategy.dependencySubstitution {
        substitute module('io.github.west3436:zas-api') using project(':zas-api')
    }
}

// The addon as it ships, nested API included, plus the API-007 tests.
def oneCopyJar = tasks.register('oneCopyJar', Jar) {
    archiveClassifier = 'one-copy'
    from sourceSets.main.output
    from sourceSets.oneCopy.output
    from tasks.named('jarJar')
}

dependencies {
    oneCopyRunRuntimeOnly(project(':zas')) { transitive = false }
    oneCopyRunRuntimeOnly files(oneCopyJar)
}
