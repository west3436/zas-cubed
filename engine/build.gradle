// Plain Java: no Minecraft, no NeoForge (CORE-043). The classes ship inside
// the zas jar (architecture §2.1); this project exists so the engine's tests
// and benchmarks run without Minecraft.

apply plugin: 'jacoco'

// `./gradlew :engine:jacocoTestReport` writes the coverage report CI shows
// (NFR-030) to build/reports/jacoco/test.
jacoco {
    toolVersion = '0.8.13'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // NFR-010: -Pfuzz.seed=S replays a seed, -Pfuzz.seeds=N runs N seeds from it, as the nightly run does.
    ['fuzz.seed', 'fuzz.seeds', 'fuzz.ops'].each { name ->
        def value = providers.gradleProperty(name).orNull
        if (value != null) {
            systemProperty "zas.$name", value
        }
    }
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// Engine benchmarks (architecture §8): a plain
// main program in its own source set, so no Minecraft and no extra plugin.
// `./gradlew :engine:bench` runs them all; `-Pbench.args="s10 fill"` picks
// cases and `-Pbench.args=--quick` shortens every run. Not part of build, but
// check compiles them so they can't rot. Their results are in the archived
// https://github.com/west3436/zas-cubed/blob/128e69fe9056e122f5cc8b095d8cca84e51592e4/docs/research/benchmarks.md
sourceSets {
    bench {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

tasks.register('bench', JavaExec) {
    group = 'verification'
    description = 'Runs the headless engine benchmarks (not part of build).'
    classpath = sourceSets.bench.runtimeClasspath
    mainClass = 'io.github.west3436.zas.engine.bench.EngineBench'
    // D-40: the reference dedicated server runs with a 4 GB heap.
    jvmArgs '-Xms4g', '-Xmx4g', '-Dstdout.encoding=UTF-8'
    def benchArgs = providers.gradleProperty('bench.args').getOrElse('')
    if (!benchArgs.isBlank()) {
        args benchArgs.trim().split(/\s+/)
    }
    // Always run when asked: the numbers are the output.
    outputs.upToDateWhen { false }
}

// NFR-034: CI's check against the recorded baseline, a commit whose engine it
// builds and runs beside this one. Not part of build, as it takes a minute or two
// of steady CPU. See "Regression check" in the archived benchmarks note:
// https://github.com/west3436/zas-cubed/blob/128e69fe9056e122f5cc8b095d8cca84e51592e4/docs/research/benchmarks.md#regression-check-nfr-034-2026-11-06
def s10Baseline = new Properties()
file('s10-baseline.properties').withReader { s10Baseline.load(it) }
def s10Commit = s10Baseline.getProperty('commit')
def s10Zip = layout.buildDirectory.file("s10-baseline/${s10Commit}.zip")

def fetchS10Baseline = tasks.register('fetchS10Baseline') {
    description = 'Reads the engine at the commit NFR-034 compares against into a zip.'
    inputs.property('commit', s10Commit)
    outputs.file(s10Zip)
    def root = rootDir
    doLast {
        def git = { String... args ->
            new ProcessBuilder(['git', *args]).directory(root).inheritIO().start().waitFor()
        }
        // CI's shallow clone doesn't have it.
        if (git('cat-file', '-e', "${s10Commit}^{commit}".toString()) != 0
                && git('fetch', '--quiet', '--depth=1', 'origin', s10Commit) != 0) {
            throw new GradleException("NFR-034: can't fetch the baseline commit ${s10Commit}.")
        }
        def zip = s10Zip.get().asFile
        zip.parentFile.mkdirs()
        if (git('archive', '--format=zip', '-o', zip.path, s10Commit, 'engine/src/main/java', 'engine/src/bench/java') != 0) {
            throw new GradleException("NFR-034: can't read the engine at the baseline commit ${s10Commit}.")
        }
    }
}

def compileS10Baseline = tasks.register('compileS10Baseline', JavaCompile) {
    dependsOn fetchS10Baseline
    source = zipTree(s10Zip)
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('s10-baseline/classes')
    javaCompiler = javaToolchains.compilerFor(java.toolchain)
    sourceCompatibility = java.toolchain.languageVersion.get().toString()
    targetCompatibility = sourceCompatibility
}

tasks.register('benchCheck', JavaExec) {
    group = 'verification'
    description = 'Fails if the S-10 script costs over 10 % more than its recorded baseline (NFR-034).'
    dependsOn compileS10Baseline
    classpath = sourceSets.bench.runtimeClasspath
    mainClass = 'io.github.west3436.zas.engine.bench.RegressionCheck'
    jvmArgs '-Xms4g', '-Xmx4g', '-Dstdout.encoding=UTF-8'
    doFirst {
        args s10Commit, compileS10Baseline.get().destinationDirectory.get().asFile.path, classpath.asPath
    }
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn tasks.named('benchClasses')
}
