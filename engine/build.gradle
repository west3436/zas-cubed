// Plain Java: no Minecraft, no NeoForge (CORE-043). The classes ship inside
// the zas jar (architecture §2.1); this project exists so the engine's tests
// and benchmarks run without Minecraft.

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Engine benchmarks (architecture §8, docs/research/benchmarks.md): a plain
// main program in its own source set, so no Minecraft and no extra plugin.
// `./gradlew :engine:bench` runs them all; `-Pbench.args="s10 fill"` picks
// cases and `-Pbench.args=--quick` shortens every run. Not part of build, but
// check compiles them so they can't rot.
sourceSets {
    bench {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

tasks.register('bench', JavaExec) {
    group = 'verification'
    description = 'Runs the headless engine benchmarks (not part of build).'
    classpath = sourceSets.bench.runtimeClasspath
    mainClass = 'io.github.west3436.zas.engine.bench.EngineBench'
    // D-40: the reference dedicated server runs with a 4 GB heap.
    jvmArgs '-Xms4g', '-Xmx4g', '-Dstdout.encoding=UTF-8'
    def benchArgs = providers.gradleProperty('bench.args').getOrElse('')
    if (!benchArgs.isBlank()) {
        args benchArgs.trim().split(/\s+/)
    }
    // Always run when asked: the numbers are the output.
    outputs.upToDateWhen { false }
}

tasks.named('check') {
    dependsOn tasks.named('benchClasses')
}
