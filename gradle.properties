org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain, verified 2026-10-30 (https://github.com/west3436/zas-cubed/blob/128e69fe9056e122f5cc8b095d8cca84e51592e4/docs/research/neoforge-1.21.1.md#1-toolchain)
minecraft_version=1.21.1
# What we build and test against, and every mod's minimum (NFR-020): one number, so CI always
# tests the floor. Raising it raises the floor.
neo_version=21.1.264
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The mods share one version. The API has its own semver (API-002), 0.x
# until R1 (API-041).
mod_version=0.1.0
api_version=0.1.0

# The last released API version, the baseline for the binary-compatibility
# check (API-043). Empty until the first release, which skips the check.
api_baseline_version=

# Mekanism (MEK-001, MEK-003). The adapter compiles against mekanism_version, the newest build for
# 1.21.1, and its GameTests run with it. mekanism_floor_version is the oldest build the adapter
# supports and mekanism_unsupported_version the one before it: -Pmekanism.version=floor and
# -Pmekanism.version=unsupported run the tests with those, as CI does beside the newest. With the
# unsupported one the tests check that the adapter stays off.
mekanism_version=1.21.1-10.7.19.85
mekanism_floor_version=1.21.1-10.7.15.81
mekanism_unsupported_version=1.21.1-10.7.14.79
