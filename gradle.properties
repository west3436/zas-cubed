org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain, verified 2026-10-30 (https://github.com/west3436/zas-cubed/blob/128e69fe9056e122f5cc8b095d8cca84e51592e4/docs/research/neoforge-1.21.1.md#1-toolchain)
minecraft_version=1.21.1
# What we build and test against, and every mod's minimum (NFR-020): one number, so CI always
# tests the floor. Raising it raises the floor.
neo_version=21.1.264
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The mods share one version. The API has its own semver (API-002), and is 1.x
# from R1 on (API-041): only a new major version may break it.
mod_version=1.0.0
api_version=1.0.0

# The last released API version, the baseline for the binary-compatibility
# check (API-043). The check downloads zas-api-<api_baseline_version>.jar from
# the GitHub release api_baseline_tag
# and refuses a jar whose SHA-256 isn't api_baseline_sha256, which is the
# jar's line in that release's SHA256SUMS.txt. After a release, set all three.
# With the version empty the check is skipped.
api_baseline_version=1.0.0
api_baseline_tag=v1.0.0
api_baseline_sha256=2d2159370bc3ab153629b4c154b2a00e01e42ef169f29328dcb9cd8a4c82022c

# Mekanism (MEK-001, MEK-003). The adapter compiles against mekanism_version, the newest build for
# 1.21.1, and its GameTests run with it. mekanism_floor_version is the oldest build the adapter
# supports and mekanism_unsupported_version the one before it: -Pmekanism.version=floor and
# -Pmekanism.version=unsupported run the tests with those, as CI does beside the newest. With the
# unsupported one the tests check that the adapter stays off.
mekanism_version=1.21.1-10.7.19.85
mekanism_floor_version=1.21.1-10.7.15.81
mekanism_unsupported_version=1.21.1-10.7.14.79

# The recipe viewers (COMPAT-060 to COMPAT-062): the oldest version each plugin supports, which it
# is compiled against. The range each accepts is in its plugin class, and starts at this version.
# The unsupported versions are the newest of each viewer below that range that this Minecraft
# loads: -Pjei.version=unsupported and -Pemi.version=unsupported run the tests with them, as CI
# does, and the tests then check that the plugin stays off (COMPAT-002). JEI's is the build before
# the oldest supported one. EMI's is its last build for 1.21, named as its maven names it.
jei_version=19.21.0.247
jei_unsupported_version=19.21.0.246
emi_version=1.1.13
emi_unsupported_version=1.1.12+1.21

# Ponder (CLIENT-023, CLIENT-024). ponder_version and flywheel_version are the copies the ZAS³
# Ponder addon nests, which the scenes' dev client runs with. The two floor versions are the copies
# Create create_version nests: the oldest Ponder the scenes support, which they are compiled
# against (the range is in zas_atmos's PonderGate), and the least the addon's nested ranges accept.
# create_version is that Create, as Modrinth names it, which the scenes' server tests load.
# create_unsupported_version is the last Create whose Ponder is older:
# -Pcreate.version=unsupported runs the tests with it, as CI does, and the tests then check that
# the scenes stay off (COMPAT-002).
ponder_version=1.0.87+mc1.21.1
ponder_floor_version=1.0.82+mc1.21.1
flywheel_version=1.0.7
flywheel_floor_version=1.0.6
create_version=6.0.10+mc1.21.1
create_unsupported_version=mc1.21.1-6.0.9
