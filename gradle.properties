org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain, verified 2026-10-30 (https://github.com/west3436/zas-cubed/blob/128e69fe9056e122f5cc8b095d8cca84e51592e4/docs/research/neoforge-1.21.1.md#1-toolchain)
minecraft_version=1.21.1
# What we build and test against, and every mod's minimum (NFR-020): one number, so CI always
# tests the floor. Raising it raises the floor.
neo_version=21.1.264
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The mods share one version. The API has its own semver (API-002), and is 1.x
# from R1 on (API-041): only a new major version may break it.
mod_version=1.0.0
api_version=1.1.0

# The last released API version, the baseline for the binary-compatibility
# check (API-043). The check downloads zas-api-<api_baseline_version>.jar from
# the GitHub release api_baseline_tag
# and refuses a jar whose SHA-256 isn't api_baseline_sha256, which is the
# jar's line in that release's SHA256SUMS.txt. After a release, set all three.
# With the version empty the check is skipped.
api_baseline_version=1.0.0
api_baseline_tag=v1.0.0
api_baseline_sha256=2d2159370bc3ab153629b4c154b2a00e01e42ef169f29328dcb9cd8a4c82022c

# Mekanism (MEK-001, MEK-003). The adapter compiles against mekanism_version, the newest build for
# 1.21.1, and its GameTests run with it. mekanism_floor_version is the oldest build the adapter
# supports and mekanism_unsupported_version the one before it: -Pmekanism.version=floor and
# -Pmekanism.version=unsupported run the tests with those, as CI does beside the newest. With the
# unsupported one the tests check that the adapter stays off.
mekanism_version=1.21.1-10.7.19.85
mekanism_floor_version=1.21.1-10.7.15.81
mekanism_unsupported_version=1.21.1-10.7.14.79

# The recipe viewers (COMPAT-060 to COMPAT-062): the oldest version each plugin supports, which it
# is compiled against. The range each accepts is in its plugin class, and starts at this version.
# The unsupported versions are the newest of each viewer below that range that this Minecraft
# loads: -Pjei.version=unsupported and -Pemi.version=unsupported run the tests with them, as CI
# does, and the tests then check that the plugin stays off (COMPAT-002). JEI's is the build before
# the oldest supported one. EMI's is its last build for 1.21, named as its maven names it.
jei_version=19.21.0.247
jei_unsupported_version=19.21.0.246
emi_version=1.1.13
emi_unsupported_version=1.1.12+1.21

# CC: Tweaked (COMPAT-020 to COMPAT-022). cc_version is the oldest build the adapter supports and the
# first for this Minecraft: the adapter compiles against its API, so it uses nothing newer, and its
# GameTests run with it. cc_newest_version is the newest build, which -Pcc.version=newest runs the
# tests with, as CI does. That build asks for a newer NeoForge than neo_version, so that run alone
# builds compat-cc with cc_newest_neo_version and starts its server on it.
cc_version=1.113.0
cc_newest_version=1.121.0
cc_newest_neo_version=21.1.266

# Curios and Accessories (COMPAT-040 to COMPAT-043): the builds the adapters' GameTests run with,
# which compat-slots/build.gradle puts into runs. The ranges the adapters accept are in zas's
# Adapters table, and start at the floor versions.
#
# Curios: the newest build for 1.21.1, which the adapter is compiled against, and the oldest one,
# which is the oldest it supports. No Curios below that exists for 1.21.1, so the run with a Curios
# older than supported loads the one an old build of Accessories' compatibility layer says it is:
# curios_layer_old_build is that build on Modrinth, curios_layer_old_accessories_build the
# Accessories released the same day, and curios_unsupported_version the Curios it announces.
# curios_layer_build is the layer's newest build, and curios_layer_version the Curios that one
# announces.
curios_version=9.5.1+1.21.1
curios_floor_version=9.2.0+1.21.1
curios_unsupported_version=9.0.12+1.21.1
curios_layer_old_build=BtkZMMXY
curios_layer_old_accessories_build=UucHtqmr
curios_layer_build=YNkFAIw4
curios_layer_version=9.3.1+1.21.1
# Accessories: the newest build for 1.21.1, the oldest one the adapter supports, which it is
# compiled against, and the last build before that. Accessories from 1.1.0 needs owo-lib, of which
# owo_version is the newest for 1.21.1 and owo_floor_version one from the oldest Accessories' time;
# before 1.1.0 it needs Cloth Config.
accessories_version=1.1.0-beta.54+1.21.1
accessories_floor_version=1.1.0-beta.3+1.21.1
accessories_unsupported_version=1.0.0-beta.35+1.21
owo_version=0.12.15.6-beta.1+1.21
owo_floor_version=0.12.15-beta.9+1.21
cloth_config_version=15.0.140+neoforge
