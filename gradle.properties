org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain, verified 2026-10-30 (https://github.com/west3436/zas-cubed/blob/128e69fe9056e122f5cc8b095d8cca84e51592e4/docs/research/neoforge-1.21.1.md#1-toolchain)
minecraft_version=1.21.1
# What we build and test against, and every mod's minimum (NFR-020): one number, so CI always
# tests the floor. Raising it raises the floor.
neo_version=21.1.264
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The mods share one version. The API has its own semver (API-002), and is 1.x
# from R1 on (API-041): only a new major version may break it.
mod_version=1.2.0
api_version=1.2.0

# The last released API version, the baseline for the binary-compatibility
# check (API-043). The check downloads zas-api-<api_baseline_version>.jar from
# the GitHub release api_baseline_tag
# and refuses a jar whose SHA-256 isn't api_baseline_sha256, which is the
# jar's line in that release's SHA256SUMS.txt. After a release, set all three.
# With the version empty the check is skipped.
api_baseline_version=1.2.0
api_baseline_tag=v1.2.0
api_baseline_sha256=ff6d61e58dbc197f8227e1c3b7ad05f1c068927e311308d79f2ebc90d9edb049

# Mekanism (MEK-001, MEK-003). The adapter compiles against mekanism_version, the newest build for
# 1.21.1, and its GameTests run with it. mekanism_floor_version is the oldest build the adapter
# supports and mekanism_unsupported_version the one before it: -Pmekanism.version=floor and
# -Pmekanism.version=unsupported run the tests with those, as CI does beside the newest. With the
# unsupported one the tests check that the adapter stays off.
mekanism_version=1.21.1-10.7.19.85
mekanism_floor_version=1.21.1-10.7.15.81
mekanism_unsupported_version=1.21.1-10.7.14.79

# The recipe viewers (COMPAT-060 to COMPAT-062): the oldest version each plugin supports, which it
# is compiled against. The range each accepts is in its plugin class, and starts at this version.
# The unsupported versions are the newest of each viewer below that range that this Minecraft
# loads: -Pjei.version=unsupported and -Pemi.version=unsupported run the tests with them, as CI
# does, and the tests then check that the plugin stays off (COMPAT-002). JEI's is the build before
# the oldest supported one. EMI's is its last build for 1.21, named as its maven names it.
jei_version=19.21.0.247
jei_unsupported_version=19.21.0.246
emi_version=1.1.13
emi_unsupported_version=1.1.12+1.21

# Ponder (CLIENT-023, CLIENT-024). ponder_version and flywheel_version are the copies the ZAS³
# Ponder addon nests, which the scenes' dev client runs with. The two floor versions are the copies
# Create create_version nests: the oldest Ponder the scenes support, which they are compiled
# against (the range is in zas_atmos's PonderGate), and the least the addon's nested ranges accept.
# create_version is that Create, as Modrinth names it, which the scenes' server tests load.
# create_unsupported_version is the last Create whose Ponder is older:
# -Pcreate.version=unsupported runs the tests with it, as CI does, and the tests then check that
# the scenes stay off (COMPAT-002).
ponder_version=1.0.87+mc1.21.1
ponder_floor_version=1.0.82+mc1.21.1
flywheel_version=1.0.7
flywheel_floor_version=1.0.6
create_version=6.0.10+mc1.21.1
create_unsupported_version=mc1.21.1-6.0.9

# CC: Tweaked (COMPAT-020 to COMPAT-022). cc_version is the oldest build the adapter supports and the
# first for this Minecraft: the adapter compiles against its API, so it uses nothing newer, and its
# GameTests run with it. cc_newest_version is the newest build, which -Pcc.version=newest runs the
# tests with, as CI does. That build asks for a newer NeoForge than neo_version, so that run alone
# builds compat-cc with cc_newest_neo_version and starts its server on it.
cc_version=1.113.0
cc_newest_version=1.121.0
cc_newest_neo_version=21.1.266

# Curios and Accessories (COMPAT-040 to COMPAT-043): the builds the adapters' GameTests run with,
# which compat-slots/build.gradle puts into runs. The ranges the adapters accept are in zas's
# Adapters table, and start at the floor versions.
#
# Curios: the newest build for 1.21.1, which the adapter is compiled against, and the oldest one,
# which is the oldest it supports. No Curios below that exists for 1.21.1, so the run with a Curios
# older than supported loads the one an old build of Accessories' compatibility layer says it is:
# curios_layer_old_build is that build on Modrinth, curios_layer_old_accessories_build the
# Accessories released the same day, and curios_unsupported_version the Curios it announces.
# curios_layer_build is the layer's newest build, and curios_layer_version the Curios that one
# announces.
curios_version=9.5.1+1.21.1
curios_floor_version=9.2.0+1.21.1
curios_unsupported_version=9.0.12+1.21.1
curios_layer_old_build=BtkZMMXY
curios_layer_old_accessories_build=UucHtqmr
curios_layer_build=YNkFAIw4
curios_layer_version=9.3.1+1.21.1
# Accessories: the newest build for 1.21.1, the oldest one the adapter supports, which it is
# compiled against, and the last build before that. Accessories from 1.1.0 needs owo-lib, of which
# owo_version is the newest for 1.21.1 and owo_floor_version one from the oldest Accessories' time;
# before 1.1.0 it needs Cloth Config.
accessories_version=1.1.0-beta.54+1.21.1
accessories_floor_version=1.1.0-beta.3+1.21.1
accessories_unsupported_version=1.0.0-beta.35+1.21
owo_version=0.12.15.6-beta.1+1.21
owo_floor_version=0.12.15-beta.9+1.21
cloth_config_version=15.0.140+neoforge

# KubeJS (COMPAT-050 to COMPAT-053): the builds the adapter's GameTests run with, each with the
# Rhino its own POM names. kubejs_version is the newest build for 1.21.1. kubejs_floor_version is
# the oldest one the adapter supports, which it is compiled against, and
# kubejs_unsupported_version the last build before it: -Pkubejs.version=floor and
# -Pkubejs.version=unsupported run the tests with those, as CI does beside the newest. With the
# unsupported one the tests check that the adapter stays off. The range the adapter accepts is in
# its KubeJsGate, and starts at the floor.
kubejs_version=2101.7.2-build.381
kubejs_rhino_version=2101.2.7-build.81
kubejs_floor_version=2101.7.0-build.131
kubejs_floor_rhino_version=2100.2.5-build.46
kubejs_unsupported_version=2101.7.0-build.130
kubejs_unsupported_rhino_version=2100.2.5-build.46

# Applied Energistics 2 (COMPAT-070 to COMPAT-074). ae2_version is the oldest build the adapter
# supports, its first release for this Minecraft not marked alpha or beta: the adapter compiles
# against its API jar, so it uses nothing newer, and its GameTests run with it by default.
# ae2_newest_version is the newest build, which -Pae2.version=newest runs the tests with, as CI
# does. From 19.2.0 AE2 needs GuideME, of which guideme_version is the newest for this Minecraft.
# ae2_unsupported_version is the build before the oldest: -Pae2.version=unsupported runs with it,
# and the tests then check that the adapter stays off. The range the adapter accepts is in zas's
# Adapters table, and starts at ae2_version.
ae2_version=19.0.24
ae2_newest_version=19.2.19
ae2_unsupported_version=19.0.23-beta
guideme_version=21.1.22

# PneumaticCraft: Repressurized (COMPAT-010 to COMPAT-013): the builds the adapter's GameTests run
# with, as its maven names them. pneumaticcraft_version is the newest build for 1.21.1.
# pneumaticcraft_floor_version is its first build for 1.21.1 and the oldest the adapter supports,
# which it is compiled against, so it uses nothing newer. pneumaticcraft_unsupported_version is the
# last build before it, made for 1.21, which still starts on 1.21.1: -Ppneumaticcraft.version=floor
# and -Ppneumaticcraft.version=unsupported run the tests with those, as CI does beside the newest.
# With the unsupported one the tests check that the adapter stays off. The range the adapter
# accepts is in zas's Adapters table, and starts at the floor.
pneumaticcraft_version=8.2.24+mc1.21.1
pneumaticcraft_floor_version=8.0.3+mc1.21.1
pneumaticcraft_unsupported_version=8.0.2+mc1.21

# NuclearCraft: Neoteric (COMPAT-150 to COMPAT-155): the builds the adapter's GameTests run with, as
# Modrinth names them, each with the Nuclear Radiation, which NuclearCraft requires, that was newest
# when it came out. nuclearcraft_version is the newest build for 1.21.1. nuclearcraft_floor_version
# is the oldest the adapter supports, the first release after the 1.3.0 betas and release
# candidates, which it is compiled against, so it uses nothing newer. nuclearcraft_unsupported_version
# is the last build before it: -Pnuclearcraft.version=floor and -Pnuclearcraft.version=unsupported
# run the tests with those, as CI does beside the newest. With the unsupported one the tests check
# that the adapter stays off. The range the adapter accepts is in zas's Adapters table, and starts
# at the floor.
nuclearcraft_version=1.3.11
nuclear_radiation_version=1.0.22
nuclearcraft_floor_version=1.3.2
nuclear_radiation_floor_version=1.0.18
nuclearcraft_unsupported_version=1.3.1-beta1
nuclear_radiation_unsupported_version=1.0.16

# Create Aeronautics (COMPAT-080 to COMPAT-083): the builds the adapter's GameTests run with, as
# Modrinth's maven names them, each with the Sable it needs. Aeronautics also needs Create
# (create_version), which the runs load and the adapter never names. aeronautics_version is the
# newest build for 1.21.1. aeronautics_floor_version is its first build on Sable 2 and the oldest
# the adapter supports; the adapter is compiled against that build's Sable, so it uses nothing
# newer. aeronautics_unsupported_version is the last build before it, on Sable 1.2:
# -Paeronautics.version=floor and -Paeronautics.version=unsupported run the tests with those, as
# CI does beside the newest. With the unsupported one the tests check that the adapter stays off.
# The range the adapter accepts is in zas's Adapters table, and starts at the floor.
aeronautics_version=1.3.2+mc1.21.1
aeronautics_sable_version=2.0.6+mc1.21.1
aeronautics_floor_version=1.3.0+mc1.21.1
aeronautics_floor_sable_version=2.0.0+mc1.21.1
aeronautics_unsupported_version=1.2.1+mc1.21.1
aeronautics_unsupported_sable_version=1.2.2+mc1.21.1

# Sable (COMPAT-100 to COMPAT-102): the builds the adapter's GameTests run with, as Modrinth's maven
# names them; the runs load Sable alone. sable_version is the newest build for 1.21.1.
# sable_floor_version is its first build of Sable 2 and the oldest the adapter supports, which it is
# compiled against, so it uses nothing newer. sable_unsupported_version is the last build before it:
# -Psable.version=floor and -Psable.version=unsupported run the tests with those, as CI does beside
# the newest. With the unsupported one the tests check that the adapter stays off. The range the
# adapter accepts is in zas's Adapters table, and starts at the floor.
sable_version=2.0.6+mc1.21.1
sable_floor_version=2.0.0+mc1.21.1
sable_unsupported_version=1.2.2+mc1.21.1
