plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    // SS13 Framework's Gradle plugins, at framework_version (settings.gradle). They bring Spotless and
    // the Maven publish plugin with them.
    id 'io.github.west3436.ss13.conventions' apply false
    id 'io.github.west3436.ss13.api' apply false
    // checkCredits, which check runs: every asset needs a valid entry in CREDITS. It needs Python 3
    // (python3 or python on the PATH, or -Pss13.python=<path>).
    id 'io.github.west3436.ss13.credits'
}

subprojects {
    // Java 21, UTF-8, Maven Central, Spotless (spotlessCheck runs as part of check, so build fails on
    // unformatted code: run ./gradlew spotlessApply to fix it), and, with ModDevGradle, NeoForge from
    // neo_version and Parchment from gradle.properties. A project whose target mod needs a newer
    // NeoForge for a run of its own names it as ext.runNeoVersion before it applies ModDevGradle, as
    // compat-cc does; nothing that ships is built that way.
    apply plugin: 'io.github.west3436.ss13.conventions'
    ss13 { githubRepo = 'west3436/zas-cubed' }

    group = 'io.github.west3436'
    version = mod_version

    // The API versions a mod's nested API accepts: from this one up to the next major, since only
    // a new major may break it (API-002).
    ext.api_range = "[${api_version},${(api_version.tokenize('.')[0] as int) + 1}.0)"
    // The SS13 Framework versions the release jar's nested copies accept: from framework_version up
    // to the next version that may break it, the next minor while it is 0.x and the next major from 1.0.
    ext.framework_range = ss13.versionRange(framework_version)

    // Expanded into each mod's neoforge.mods.toml.
    tasks.named('processResources', ProcessResources) {
        def props = [
            mod_version     : mod_version,
            api_version     : api_version,
            neo_version     : neo_version,
            minecraft_version: minecraft_version,
        ]
        inputs.properties(props)
        filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
    }

    // CONT-155: -Pcontent=off runs an adapter's GameTests (runAdapterGameTestServer) with the content
    // mod switched off in its startup config, so the game has to start with the adapter's target mod
    // installed and nothing of zas_atmos registered. Every such run writes the config, on or off, so
    // one run's choice never reaches the next. An adapter whose tests build with the content leaves
    // them out of the run by their namespace, in its own build file.
    def content = providers.gradleProperty('content').getOrElse('on')
    if (!(content in ['on', 'off'])) {
        throw new GradleException("-Pcontent is on or off, not '${content}'")
    }
    ext.contentOff = content == 'off'
    tasks.matching { it.name == 'runAdapterGameTestServer' }.configureEach {
        doFirst {
            def config = layout.buildDirectory.file('adapterRun/config/zas_atmos-startup.toml').get().asFile
            config.parentFile.mkdirs()
            config.setText("[content]\nenabled = ${!contentOff}\n", 'UTF-8')
        }
    }
}
