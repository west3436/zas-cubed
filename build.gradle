plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'com.diffplug.spotless' version '8.10.4' apply false
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.diffplug.spotless'

    group = 'io.github.west3436'
    version = mod_version

    // The API versions a mod's nested API accepts: from this one up to the next major, since only
    // a new major may break it (API-002).
    ext.api_range = "[${api_version},${(api_version.tokenize('.')[0] as int) + 1}.0)"

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        mavenCentral()
    }

    // spotlessCheck runs as part of check, so build fails on unformatted code.
    // Run ./gradlew spotlessApply to fix it.
    spotless {
        java {
            target 'src/*/java/**/*.java'
            palantirJavaFormat('2.103.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    // Every ModDevGradle project uses the same NeoForge and Parchment. One whose target mod needs a
    // newer NeoForge for a run of its own names it as ext.runNeoVersion before it applies the plugin,
    // as compat-cc does; nothing that ships is built that way.
    plugins.withId('net.neoforged.moddev') {
        neoForge {
            version = project.findProperty('runNeoVersion') ?: neo_version
            parchment {
                mappingsVersion = parchment_mappings_version
                minecraftVersion = parchment_minecraft_version
            }
        }
    }

    // Expanded into each mod's neoforge.mods.toml.
    tasks.named('processResources', ProcessResources) {
        def props = [
            mod_version     : mod_version,
            api_version     : api_version,
            neo_version     : neo_version,
            minecraft_version: minecraft_version,
        ]
        inputs.properties(props)
        filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
    }

    // CONT-155: -Pcontent=off runs an adapter's GameTests (runAdapterGameTestServer) with the content
    // mod switched off in its startup config, so the game has to start with the adapter's target mod
    // installed and nothing of zas_atmos registered. Every such run writes the config, on or off, so
    // one run's choice never reaches the next. An adapter whose tests build with the content leaves
    // them out of the run by their namespace, in its own build file.
    def content = providers.gradleProperty('content').getOrElse('on')
    if (!(content in ['on', 'off'])) {
        throw new GradleException("-Pcontent is on or off, not '${content}'")
    }
    ext.contentOff = content == 'off'
    tasks.matching { it.name == 'runAdapterGameTestServer' }.configureEach {
        doFirst {
            def config = layout.buildDirectory.file('adapterRun/config/zas_atmos-startup.toml').get().asFile
            config.parentFile.mkdirs()
            config.setText("[content]\nenabled = ${!contentOff}\n", 'UTF-8')
        }
    }
}
