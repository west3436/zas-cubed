pluginManagement {
    repositories {
        gradlePluginPortal()
        // com.vanniktech.maven.publish is published to Maven Central only.
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'zas-cubed'

// Architecture §2.1. The API project is named `zas-api`, the same as its
// published artifactId: ModDevGradle writes a project's jar-in-jar identity
// as group:<project name>, and a mismatch makes FML treat consumers' copies
// and ours as one library and keep whichever it saw first.
include 'engine', 'zas-api', 'zas', 'compat-adastra', 'zas-atmos', 'example-addon'

// The recipe viewer plugins (COMPAT-060 to COMPAT-062). Their classes ship inside the zas jar.
include 'compat-jei', 'compat-emi'

// The Ponder scenes, a client addon of their own that nests Ponder and Flywheel (D-83).
include 'zas-ponder'

// The jar players install: zas and zas_atmos in one file (D-88).
include 'dist'

// The in-game S-10 bench: a dev-only mod and server run, never published.
include 's10-bench'
