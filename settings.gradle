pluginManagement {
    repositories {
        gradlePluginPortal()
        // com.vanniktech.maven.publish is published to Maven Central only.
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'zas-cubed'

// Architecture §2.1. The API project is named `zas-api`, the same as its
// published artifactId: ModDevGradle writes a project's jar-in-jar identity
// as group:<project name>, and a mismatch makes FML treat consumers' copies
// and ours as one library and keep whichever it saw first.
include 'engine', 'zas-api', 'zas', 'compat-adastra', 'zas-atmos', 'example-addon'

// The recipe viewer plugins (COMPAT-060 to COMPAT-062). Their classes ship inside the zas jar.
include 'compat-jei', 'compat-emi'

// The Ponder scenes (CLIENT-023): part of zas_atmos in the release jar, on with any Ponder. And the
// ZAS³ Ponder addon, a client addon that nests Ponder and Flywheel for players without Create (D-83).
include 'compat-ponder', 'zas-ponder'

// The Mekanism adapter (MEK), bundled into the zas jar like compat-adastra.
include 'compat-mekanism'

// The Curios and Accessories adapters (COMPAT-040 to COMPAT-043), bundled into the zas jar likewise.
include 'compat-slots'

// The KubeJS adapter (COMPAT-050 to COMPAT-053), bundled into the zas jar likewise.
include 'compat-kubejs'

// The jar players install: zas and zas_atmos in one file (D-88).
include 'dist'

// The Jade adapter (COMPAT-030 to COMPAT-032): part of zas_atmos in the release jar.
include 'compat-jade'

// The CC: Tweaked adapter (COMPAT-020 to COMPAT-022): part of zas_atmos in the release jar.
include 'compat-cc'

// The in-game S-10 bench: a dev-only mod and server run, never published.
include 's10-bench'
