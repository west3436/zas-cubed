apply plugin: 'net.neoforged.moddev'

// The ZAS³ Ponder addon (D-83): Ponder and Flywheel for players without Create, and nothing else. No
// site publishes those two on their own for 1.21.1, so this client addon nests them. The scenes
// themselves are part of zas_atmos (:compat-ponder) and show with any Ponder: Create's, or this
// addon's. zas_atmos never requires either, so a player can leave them out (NFR-022).
base { archivesName = 'zas_ponder' }

// What the jar nests, and the least it accepts. The ranges start at the copies Create 6.0.10 nests,
// so with Create installed FML may load Create's copies instead; the scenes are compiled against
// those.
def ponderRange = "[${ponder_floor_version},)"
def flywheelRange = "[${flywheel_floor_version},2.0)"

repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.createmod.net' }
        }
        filter {
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
}

sourceSets {
    // CLIENT-025: a GameTest that runs inside the built addon, on a dedicated server.
    serverCheck
    // That run's classpath, empty on purpose: the addon and the release jar come in as built jars, so
    // FML's jar-in-jar locator takes Ponder and Flywheel out of the addon's, as in production.
    serverCheckRun
}

neoForge {
    addModdingDependenciesTo(sourceSets.serverCheck)
    addModdingDependenciesTo(sourceSets.serverCheckRun)
    runs {
        serverCheckGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.serverCheckRun
            loadedMods = []
            gameDirectory = layout.buildDirectory.dir('serverCheckRun')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'zas_ponder'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// A fresh world for each check, as in the other GameTest runs.
tasks.matching { it.name == 'runServerCheckGameTestServer' }.configureEach {
    doFirst {
        delete layout.buildDirectory.dir('serverCheckRun/world')
    }
}

dependencies {
    jarJar('net.createmod.ponder:ponder-neoforge') {
        version {
            strictly ponderRange
            prefer ponder_version
        }
    }
    jarJar('dev.engine-room.flywheel:flywheel-neoforge-1.21.1') {
        version {
            strictly flywheelRange
            prefer flywheel_version
        }
    }

    // The test asks zas_atmos what it makes of the addon.
    serverCheckCompileOnly project(':zas-atmos')
}

// The addon as it ships, nested jars included, plus the CLIENT-025 test.
def serverCheckJar = tasks.register('serverCheckJar', Jar) {
    archiveClassifier = 'server-check'
    from sourceSets.main.output
    from sourceSets.serverCheck.output
    from tasks.named('jarJar')
}

dependencies {
    // The release jar, which holds zas and zas_atmos (D-88), and the scenes.
    serverCheckRunRuntimeOnly(project(':dist')) { transitive = false }
    serverCheckRunRuntimeOnly files(serverCheckJar)
}
