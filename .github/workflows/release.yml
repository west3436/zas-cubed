name: Release

# A tag v<mod_version> on a commit on main builds the jars and attaches them to
# a draft GitHub release, which a maintainer reads and then publishes (#71). A
# 0.x version is marked as a pre-release. A PR that changes this file builds the
# same jars without releasing anything, so the workflow is tried before a tag
# needs it. On SS13 Framework's shared workflow, at the framework's tag.
#
# Assets: the ZAS³ jar (zas and zas_atmos, D-88, with the Ponder scenes), the
# optional ZAS³ Ponder addon, which brings Ponder to players without Create,
# and the API jar with its sources and javadoc jars for mod developers.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: west3436/ss13-framework/.github/workflows/shared-release.yml@v0.3.0
    with:
      title: ZAS³
      build: ":dist:jar :zas-ponder:jar :zas-api:jar :zas-api:sourcesJar :zas-api:plainJavadocJar"
      assets: |
        dist/build/libs/zas-{mod_version}.jar
        zas-ponder/build/libs/zas_ponder-{mod_version}.jar
        zas-api/build/libs/zas-api-{api_version}.jar
        zas-api/build/libs/zas-api-{api_version}-sources.jar
        zas-api/build/libs/zas-api-{api_version}-javadoc.jar
      notes: |
        For Minecraft 1.21.1 on NeoForge.

        - **`zas-{mod_version}.jar`**: ZAS³ and ZAS³ Atmospherics. Install it on the server and on every client.
        - **`zas_ponder-{mod_version}.jar`**: ZAS³ Ponder, optional and client only: Ponder and Flywheel, for the animated guides to the devices. Not needed with Create, which brings both.
        - **`zas-api-*.jar`**: the API, with its sources and javadoc, for mod developers.

        What's new: the [changelog]({wiki}/Changelog). How to play: [getting started]({wiki}/Getting-Started) and the rest of the [wiki]({wiki}).
