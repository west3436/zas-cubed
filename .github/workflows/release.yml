name: Release

# A tag v<mod_version> on a commit on main builds the jars and attaches them to
# a draft GitHub release, which a maintainer reads and then publishes (#71). A
# 0.x version is marked as a pre-release. A PR that changes this file builds the
# same jars without releasing anything, so the workflow is tried before a tag
# needs it.
#
# Assets: the ZAS³ jar (zas and zas_atmos, D-88), the optional ZAS³ Ponder
# addon, and the API jar with its sources and javadoc jars for mod developers.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build the release jars
    runs-on: ubuntu-latest
    outputs:
      mod: ${{ steps.version.outputs.mod }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, to check that a tag is on main.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Read and check the versions
        id: version
        shell: bash
        run: |
          mod=$(sed -n 's/^mod_version=//p' gradle.properties)
          api=$(sed -n 's/^api_version=//p' gradle.properties)
          echo "mod=$mod" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "v$mod" ]; then
              echo "::error::The tag $GITHUB_REF_NAME doesn't match mod_version $mod: it should be v$mod."
              exit 1
            fi
            # CI has already tested every commit on main; a tag elsewhere hasn't been.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME isn't on main."
              exit 1
            fi
          fi
      - name: Build
        run: ./gradlew :dist:jar :zas-ponder:jar :zas-api:jar :zas-api:sourcesJar :zas-api:plainJavadocJar --stacktrace
      - name: Collect
        shell: bash
        run: |
          mod=${{ steps.version.outputs.mod }}
          api=${{ steps.version.outputs.api }}
          mkdir release
          cp "dist/build/libs/zas-$mod.jar" \
             "zas-ponder/build/libs/zas_ponder-$mod.jar" \
             "zas-api/build/libs/zas-api-$api.jar" \
             "zas-api/build/libs/zas-api-$api-sources.jar" \
             "zas-api/build/libs/zas-api-$api-javadoc.jar" release/
          (cd release && sha256sum *.jar > SHA256SUMS.txt)
          ls -l release
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release

  release:
    name: Draft the GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MOD: ${{ needs.build.outputs.mod }}
        run: |
          wiki="https://github.com/$GH_REPO/wiki"
          pre=""
          case "$MOD" in 0.*) pre="--prerelease" ;; esac
          cat > notes.md <<EOF
          For Minecraft 1.21.1 on NeoForge.

          - **\`zas-$MOD.jar\`**: ZAS³ and ZAS³ Atmospherics. Install it on the server and on every client.
          - **\`zas_ponder-$MOD.jar\`**: ZAS³ Ponder, optional and client only: animated guides to the devices.
          - **\`zas-api-*.jar\`**: the API, with its sources and javadoc, for mod developers.

          What's new: the [changelog]($wiki/Changelog). How to play: [getting started]($wiki/Getting-Started) and the rest of the [wiki]($wiki).
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --draft $pre --verify-tag \
            --title "ZAS³ $MOD" --notes-file notes.md
