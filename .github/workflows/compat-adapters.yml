name: Adapter tests

# COMPAT-004: each adapter's GameTests, on a server with the adapter's target
# mod loaded. The main CI compiles the adapters but never downloads a target mod
# to run, so they run here: on a PR that touches an adapter, what zas holds for
# the adapters or the public API, nightly on main, or from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"
  pull_request:
    paths:
      - "compat-*/**"
      - "zas/src/main/java/io/github/west3436/zas/compat/**"
      - "zas-atmos/src/main/java/io/github/west3436/zas/atmos/compat/**"
      - "zas-ponder/**"
      - "zas-api/**"
      - "build.gradle"
      - ".github/workflows/compat-adapters.yml"

permissions:
  contents: read

jobs:
  adapter:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One row per adapter, or per version of its target that it is tested
        # with: its name, and the task that runs its GameTests, with any
        # arguments.
        include:
          - adapter: adastra
            task: ":compat-adastra:runAdapterGameTestServer"
          # MEK-003: the oldest Mekanism the adapter supports and the newest.
          # MEK-001: with the last one before the oldest, the adapter stays off.
          - adapter: mekanism (oldest supported)
            task: ":compat-mekanism:runAdapterGameTestServer -Pmekanism.version=floor"
          - adapter: mekanism (newest)
            task: ":compat-mekanism:runAdapterGameTestServer"
          - adapter: mekanism (older than supported)
            task: ":compat-mekanism:runAdapterGameTestServer -Pmekanism.version=unsupported"
          # COMPAT-004: the oldest Jade the adapter supports and the newest.
          # COMPAT-002: with the last one before the oldest, the readouts stay
          # off, so only the version check's tests run.
          - adapter: jade (oldest supported)
            task: ":compat-jade:runAdapterGameTestServer -Pjade.version=15.1.6+neoforge"
          - adapter: jade (newest)
            task: ":compat-jade:runAdapterGameTestServer"
          - adapter: jade (older than supported)
            task: ":compat-jade:runAdapterGameTestServer -Pjade.version=15.1.5+neoforge -Pjade.gateOnly=true"
          # COMPAT-060 to COMPAT-062: each viewer plugin with the oldest version
          # of its viewer that it supports, which it is compiled against, and
          # with the newest when the row was written.
          # COMPAT-002: with the newest one below the oldest, the plugin
          # registers nothing, so only the version check's test runs.
          - adapter: jei (oldest supported)
            task: ":compat-jei:runAdapterGameTestServer"
          - adapter: jei (newest)
            task: ":compat-jei:runAdapterGameTestServer -Pjei.version=19.70.0.469"
          - adapter: jei (older than supported)
            task: ":compat-jei:runAdapterGameTestServer -Pjei.version=unsupported"
          - adapter: emi (oldest supported)
            task: ":compat-emi:runAdapterGameTestServer"
          - adapter: emi (newest)
            task: ":compat-emi:runAdapterGameTestServer -Pemi.version=1.1.24"
          - adapter: emi (older than supported)
            task: ":compat-emi:runAdapterGameTestServer -Pemi.version=unsupported"
          # CONT-155: with the adapter's target mod installed and the content
          # switched off, the game starts and the tests that need none of the
          # content pass. For the adapters that do something as a server
          # starts: the viewer plugins only start on a client.
          - adapter: mekanism (content off)
            task: ":compat-mekanism:runAdapterGameTestServer -Pcontent=off"
          - adapter: adastra (content off)
            task: ":compat-adastra:runAdapterGameTestServer -Pcontent=off"
          - adapter: jade (content off)
            task: ":compat-jade:runAdapterGameTestServer -Pcontent=off"
          # CLIENT-023: the Ponder scenes, which are part of zas_atmos and on
          # with any Ponder. A server shows that the game starts, what a client
          # with the same mods would do and that it loads none of the scenes'
          # classes itself. Create 6.0.10 nests the oldest Ponder they support
          # and is the newest Create; 6.0.9 nests an older one, so they stay
          # off (COMPAT-002).
          - adapter: ponder (create, oldest supported and newest)
            task: ":compat-ponder:runAdapterGameTestServer"
          - adapter: ponder (create, older than supported)
            task: ":compat-ponder:runAdapterGameTestServer -Pcreate.version=unsupported"
          - adapter: ponder (create, content off)
            task: ":compat-ponder:runAdapterGameTestServer -Pcontent=off"
          # Create and the Ponder addon together: the addon holds no scenes, so
          # they are there once.
          - adapter: ponder (create and the addon)
            task: ":compat-ponder:runAdapterGameTestServer -Pponder.from=create+addon"
          # The Ponder addon as release 1.0.0 shipped it, which registers its own
          # copy of the scenes: the ones in the release jar stand down.
          - adapter: ponder (the addon released as 1.0.0)
            task: ":compat-ponder:runAdapterGameTestServer -Pponder.from=released"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # The task can succeed without the server ever starting, so the log must
      # also say that the tests passed.
      - name: GameTests
        timeout-minutes: 20
        shell: bash
        run: |
          ./gradlew ${{ matrix.task }} --stacktrace | tee gametests.log
          grep -E "All [0-9]+ required tests passed" gametests.log
      # A content-off row means nothing unless the content was off, which the
      # content mod logs as it loads.
      - name: The content was off
        if: contains(matrix.task, '-Pcontent=off')
        shell: bash
        run: grep -F "content is off in zas_atmos-startup.toml" gametests.log
