name: Adapter tests

# COMPAT-004: each adapter's GameTests, on a server with the adapter's target
# mod loaded. The main CI compiles the adapters but never downloads a target mod
# to run, so they run here: on a PR that touches an adapter or the public API,
# nightly on main, or from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"
  pull_request:
    paths:
      - "compat-*/**"
      - "zas-api/**"
      - ".github/workflows/compat-adapters.yml"

permissions:
  contents: read

jobs:
  adapter:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One row per adapter: its name, and the task that runs its GameTests.
        include:
          - adapter: adastra
            task: ":compat-adastra:runAdapterGameTestServer"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # The task can succeed without the server ever starting, so the log must
      # also say that the tests passed.
      - name: GameTests
        timeout-minutes: 20
        shell: bash
        run: |
          ./gradlew ${{ matrix.task }} --stacktrace | tee gametests.log
          grep -E "All [0-9]+ required tests passed" gametests.log
