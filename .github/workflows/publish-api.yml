name: Publish API to Maven Central

# API-008: releases the API of a released version to Maven Central as
# io.github.west3436:zas-api, signed, with its sources and javadoc jars. A
# release on Central can never be changed or removed, so nothing starts this
# but a maintainer, from the Actions tab, naming the release's tag. Snapshots
# are published by CI after every green build on main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose API to publish, such as v1.0.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish the API
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      # Central requires signatures on releases.
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          # The whole history, to check that the tag is on main.
          fetch-depth: 0
      - name: Check the tag and the secrets
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mod=$(sed -n 's/^mod_version=//p' gradle.properties)
          api=$(sed -n 's/^api_version=//p' gradle.properties)
          if [ "$TAG" != "v$mod" ]; then
            echo "::error::$TAG isn't the tag of mod_version $mod, which would be v$mod."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG isn't on main."
            exit 1
          fi
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]; then
            echo "::error::CENTRAL_USERNAME or CENTRAL_PASSWORD is not set."
            exit 1
          fi
          if [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "::error::SIGNING_KEY is not set, and Central takes no unsigned release."
            exit 1
          fi
          echo "::notice::Publishing zas-api $api from $TAG."
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Central checks the upload before it publishes anything: if a check
      # fails, nothing is released and this step fails.
      - name: Publish and release
        run: ./gradlew :zas-api:publishAndReleaseToMavenCentral --stacktrace
