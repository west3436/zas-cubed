name: Publish API to Maven Central

# API-008: releases the API of a released version to Maven Central as
# io.github.west3436:zas-api, signed, with its sources and javadoc jars. A
# release on Central can never be changed or removed, so nothing starts this
# but a maintainer, from the Actions tab, naming the release's tag. Snapshots
# are published by CI after every green build on main. On SS13 Framework's
# shared workflow, at the framework's tag, which checks that the tag is
# v<mod_version> and on main, and that the secrets are set, before Gradle runs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose API to publish, such as v1.0.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish the API
    uses: west3436/ss13-framework/.github/workflows/shared-publish.yml@v0.3.0
    with:
      tag: ${{ inputs.tag }}
      # Central checks the upload before it publishes anything: if a check
      # fails, nothing is released and the job fails.
      publish: ":zas-api:publishAndReleaseToMavenCentral"
      what: "zas-api {api_version}"
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
