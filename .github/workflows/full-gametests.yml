name: Full GameTests

# zas's GameTests again, with zas_atmos loaded, alongside zas_atmos's own. Each
# PR leaves those repeats out to stay inside CI's time limit, so they run here:
# nightly on main, or from the Actions tab. On SS13 Framework's shared workflow,
# at the framework's tag.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  gametests:
    name: GameTests of both mods with both loaded
    uses: west3436/ss13-framework/.github/workflows/shared-gametests.yml@v0.3.0
    with:
      task: ":zas-atmos:runGameTestServer"
      # zas's tests must be among them. The log lists the namespaces in either
      # order.
      log-must-match: 'Enabled Gametest Namespaces: \[(zas, zas_atmos|zas_atmos, zas)\]'
