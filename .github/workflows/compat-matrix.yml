name: Compatibility matrix

# NFR-025: every GameTest, with ModernFix, FerriteCore and Lithium on the run's
# classpath. Never on a PR: it runs nightly on main, or from the Actions tab.
# docs/release-checklist.md has the rest, including the client launch.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  matrix:
    name: GameTests with the matrix's server mods
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # The task can succeed without the server ever starting, so the log must
      # also say that the tests passed.
      - name: GameTests
        timeout-minutes: 20
        shell: bash
        run: |
          ./gradlew :zas-atmos:runGameTestServer -Pcompat.matrix=true --stacktrace | tee gametests.log
          grep -E "All [0-9]+ required tests passed" gametests.log
