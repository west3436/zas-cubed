name: Compatibility matrix

# NFR-025: every GameTest, with ModernFix, FerriteCore and Lithium on the run's
# classpath. Never on a PR: it runs nightly on main, or from the Actions tab.
# The wiki's Release-Checklist page has the rest, including the client launch.
# On SS13 Framework's shared workflow, at the framework's tag.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  matrix:
    name: GameTests with the matrix's server mods
    uses: west3436/ss13-framework/.github/workflows/shared-gametests.yml@v0.3.0
    with:
      task: ":zas-atmos:runGameTestServer -Pcompat.matrix=true"
