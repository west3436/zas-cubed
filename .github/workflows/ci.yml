name: CI

# ZAS³'s CI, on SS13 Framework's shared workflow at the framework's tag
# (v<framework_version> in gradle.properties: raise them together). Its header
# says what each input does.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: west3436/ss13-framework/.github/workflows/shared-build.yml@v0.3.0
    with:
      # check, inside build, runs checkCredits (asset provenance, NFR-045),
      # Spotless and the API's checks: packages, dependencies, javadoc and the
      # compatibility check (API-043, NFR-033), :zas-api:apiCompat.
      #
      # Then, in the same job:
      #
      # NFR-030: the engine's line coverage, on this run's summary page, with
      # the full report as an artifact. The tests have already run in build.
      #
      # NFR-034: the S-10 script on the engine at the commit in
      # engine/s10-baseline.properties and on this code, side by side on this
      # machine, because CI's machines differ too much to compare times
      # between them. Five minutes at most.
      after-build: |
        ./gradlew :engine:jacocoTestReport --stacktrace
        python3 scripts/coverage_summary.py engine/build/reports/jacoco/test/jacocoTestReport.xml >> "$GITHUB_STEP_SUMMARY"
        timeout 5m ./gradlew :engine:benchCheck --stacktrace
      artifact-name: engine-coverage
      artifact-path: engine/build/reports/jacoco/test/html
      # Each line: the number of GameTest servers that must report that their
      # tests passed, then the Gradle arguments.
      #
      # 1. Each mod's own GameTests on its own server. zas's tests with
      #    zas_atmos loaded as well run nightly: full-gametests.yml.
      # 2. S-12 (API-048): the example addon, which nests the API, on a
      #    GameTest server without zas. The fallback must answer with standard
      #    air.
      # 3. API-007: the built release jar and a built copy of the example
      #    addon, each nesting the API, on one server. They must share one
      #    copy. The same server has a second consumer of SS13 Framework,
      #    which nests a newer framework than the release jar does: one copy of
      #    the framework must load, the newest.
      # 4. CLIENT-025 (NFR-022): the built Ponder addon, which nests Ponder and
      #    Flywheel, on a dedicated server with the release jar, which holds
      #    the Ponder scenes.
      # 5. CONT-052 and CONT-155: the release jar, which holds zas and
      #    zas_atmos, on a dedicated server with the content on, then on
      #    another with it off. Neither has Ponder, so neither may load any of
      #    the Ponder scenes (CLIENT-023, NFR-022).
      gametests: |
        2 runGameTestServer -x :example-addon:runGameTestServer -Pgametests.ownOnly=true
        1 :example-addon:runGameTestServer
        1 :example-addon:runOneCopyGameTestServer
        1 :zas-ponder:runServerCheckGameTestServer
        2 :dist:runReleaseCheckGameTestServer :dist:runContentOffGameTestServer
      # The first run takes 5 to 7 minutes, and over 10 on a slow machine; the
      # four others up to 5 each.
      gametest-timeout-minutes: 40
      # A snapshot of the API on the Central Portal (API-008, D-18), after a
      # green build on main.
      snapshot: ":zas-api:publishToMavenCentral -PapiSnapshot=true"
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
