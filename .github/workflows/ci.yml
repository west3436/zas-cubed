name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for Gradle build
        id: gradle
        run: |
          if [ -f gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Gradle build yet (Phase C); skipping."
          fi
      - uses: actions/setup-java@v6
        if: steps.gradle.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.gradle.outputs.present == 'true'
      - name: Build
        if: steps.gradle.outputs.present == 'true'
        run: ./gradlew build --stacktrace
      - name: GameTests (dedicated server)
        if: steps.gradle.outputs.present == 'true'
        run: ./gradlew runGameTestServer --stacktrace

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true
