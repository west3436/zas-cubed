name: Integrity fuzz

# NFR-010: 20 seeds, of 10,000 operations each, on the engine and in a real level
# with pipes. Every PR runs one seed of each as part of the build. This runs
# nightly on main, or from the Actions tab for any seeds. A failure names its
# seed, its operation and the command that replays it.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: The first seed
        default: "1"
      seeds:
        description: How many seeds to run from it
        default: "20"
  schedule:
    - cron: "47 4 * * *"

permissions:
  contents: read

# A scheduled run has no inputs.
env:
  SEED: ${{ inputs.seed || '1' }}
  SEEDS: ${{ inputs.seeds || '20' }}

jobs:
  # A seed takes one and a half to two minutes on a runner, so 20 in a row no
  # longer fit one job's 30 minutes. The seeds are shared out over four jobs
  # that run side by side, the first ones taking any remainder.
  engine:
    name: Engine fuzz (part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Fuzz
        timeout-minutes: 30
        shell: bash
        env:
          PART: ${{ matrix.part }}
        run: |
          index=$(( PART - 1 ))
          each=$(( SEEDS / 4 ))
          extra=$(( SEEDS % 4 ))
          count=$(( each + (index < extra ? 1 : 0) ))
          first=$(( SEED + index * each + (index < extra ? index : extra) ))
          touch fuzz.log
          if [ "$count" -eq 0 ]; then
            echo "No seeds for this part: $SEEDS shared out over 4."
            exit 0
          fi
          echo "Part $PART: $count seeds from $first."
          ./gradlew :engine:test --tests '*IntegrityFuzzTest*' -Pfuzz.seed="$first" -Pfuzz.seeds="$count" --info | tee fuzz.log
      - name: What each seed did
        if: always()
        shell: bash
        run: |
          grep -E "NFR-010: seed [0-9]+" fuzz.log || true

  pipes:
    name: Fuzz with pipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # The task can succeed without the server ever starting, so the log must
      # also say that the tests passed.
      - name: GameTests
        timeout-minutes: 20
        shell: bash
        run: |
          ./gradlew :zas-atmos:runGameTestServer -Pfuzz.seed="$SEED" -Pfuzz.seeds="$SEEDS" --stacktrace | tee fuzz.log
          grep -E "All [0-9]+ required tests passed" fuzz.log
      - name: What each seed did
        if: always()
        shell: bash
        run: |
          grep -E "NFR-010: seed [0-9]+" fuzz.log || true
