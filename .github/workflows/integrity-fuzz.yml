name: Integrity fuzz

# NFR-010: the engine's fuzz on 20 seeds, of 10,000 operations each. Every PR
# runs one seed as part of the build. This runs from the Actions tab only while
# seeds still fail on the bugs listed under NFR-010: on a schedule it would only
# report them every night. It goes on a nightly schedule once all 20 pass.
on:
  workflow_dispatch:
    inputs:
      seed:
        description: The first seed
        default: "1"
      seeds:
        description: How many seeds to run from it
        default: "20"

permissions:
  contents: read

jobs:
  fuzz:
    name: Engine fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # A failure names its seed, its operation and the command that replays it.
      - name: Fuzz
        timeout-minutes: 30
        shell: bash
        env:
          SEED: ${{ inputs.seed }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          ./gradlew :engine:test --tests '*IntegrityFuzzTest*' -Pfuzz.seed="$SEED" -Pfuzz.seeds="$SEEDS" --info | tee fuzz.log
      - name: What each seed did
        if: always()
        shell: bash
        run: grep -E "NFR-010: seed [0-9]+" fuzz.log || true
