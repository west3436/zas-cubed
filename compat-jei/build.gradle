apply plugin: 'net.neoforged.moddev'

// The JEI plugin (COMPAT-060, COMPAT-061): every gas and every reaction as JEI pages. JEI finds it
// by its @JeiPlugin annotation, and only on a client that has JEI. Its classes ship inside the zas
// jar, as the other adapters' do. Unlike them it compiles against zas itself, not the public API
// alone: what it shows is zas's own client state, which the public API doesn't give. Of JEI it has
// only the API jar to compile against, so it can't name a class outside JEI's API (COMPAT-003).

// JEI's maven, for JEI alone.
repositories {
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.blamejared.com/' }
        }
        filter { includeGroup 'mezz.jei' }
    }
}

// The plugin compiles against the oldest JEI it supports, so it can't use anything newer by
// mistake. Its tests run with that version too, or with -Pjei.version's, such as the newest.
// -Pjei.version=unsupported runs with the newest JEI below the plugin's range, and with the tests
// that check the plugin stays off there (COMPAT-002).
def chosen = providers.gradleProperty('jei.version').getOrElse(jei_version)
def unsupported = chosen == 'unsupported'
def jeiRunVersion = unsupported ? jei_unsupported_version : chosen

sourceSets {
    // The plugin's GameTests, which run with JEI loaded (COMPAT-004). They stay out of every jar
    // but the one their own run loads.
    gametest {
        compileClasspath += main.output + main.compileClasspath
    }
    // That run's classpath, empty on purpose: zas comes in as the release jar, as a player has it,
    // so the tests also show that the jar holds the plugin.
    gametestRun
}

configurations {
    releaseJar {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    compileOnly project(':zas')
    compileOnly project(':engine')
    compileOnly project(':zas-api')
    // Compile-only, never bundled: the plugin is optional (NFR-022).
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }

    releaseJar project(':dist')
}

neoForge {
    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.gametestRun)
    runs {
        // Not named gameTestServer: the main CI runs every project's runGameTestServer, and this
        // one needs JEI, which that build never downloads.
        adapterGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametestRun
            loadedMods = []
            gameDirectory = layout.buildDirectory.dir('adapterRun')
            // The run named unsupported has tests of its own, which check that the plugin is off.
            // A version given by name gets the usual tests, so they fail on one that isn't supported.
            systemProperty 'neoforge.enabledGameTestNamespaces', unsupported ? 'zas_jei_off' : 'zas'
            // The JEI the tests expect to find installed.
            systemProperty 'zas.jei.runVersion', jeiRunVersion
            jvmArgument '-Xmx4G'
            jvmArgument '-XX:+ExitOnOutOfMemoryError'
        }
    }
}

// The release jar plus the tests, and the framework's empty GameTest structure for them to run in,
// once in each namespace the tests are in.
def adapterTestJar = tasks.register('adapterTestJar', Jar) {
    archiveClassifier = 'adapter-test'
    dependsOn configurations.releaseJar
    inputs.files(configurations.releaseJar)
    from({ configurations.releaseJar.collect { zipTree(it) } })
    from sourceSets.gametest.output
    ['zas', 'zas_jei_off'].each { namespace ->
        from(project(':zas').file('src/gametest/resources/data/zas/structure/empty.nbt')) {
            into "data/${namespace}/structure"
        }
    }
}

dependencies {
    gametestRunRuntimeOnly files(adapterTestJar)
    // JEI's own jar nests the one library it needs.
    gametestRunRuntimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jeiRunVersion}") { transitive = false }
}

// The tests start from a fresh world, as zas's do: saved zones would otherwise come back. And from
// a fresh log, which the unsupported run's test reads.
tasks.matching { it.name == 'runAdapterGameTestServer' }.configureEach {
    doFirst {
        delete layout.buildDirectory.dir('adapterRun/world')
        delete layout.buildDirectory.dir('adapterRun/logs')
    }
}
