apply plugin: 'net.neoforged.moddev'

base { archivesName = 'zas_atmos' }

evaluationDependsOn(':zas')

sourceSets {
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

// The TGUI kit's fonts (D-76). Minecraft rasterises a TrueType font once for each definition, at its
// size times its oversample, and text is sharp only where the oversample is the GUI scale, so each
// face gets a definition per scale. Glyphs DejaVu lacks fall back to Minecraft's own font.
def tguiFonts = tasks.register('generateTguiFonts') {
    def out = layout.buildDirectory.dir('generated/tguiFonts')
    outputs.dir(out)
    doLast {
        // Size 8 is only for warning icons, whose shapes are lost at 6.
        [[weight: 'regular', file: 'dejavu_sans', sizes: [6, 7, 8]],
         [weight: 'bold', file: 'dejavu_sans_bold', sizes: [6, 7]]].each { face ->
            def (weight, file) = [face.weight, face.file]
            face.sizes.each { size ->
                (1..9).each { oversample ->
                    def json = out.get().file("assets/zas_atmos/font/tgui/${weight}_${size}_x${oversample}.json").asFile
                    json.parentFile.mkdirs()
                    json.text = groovy.json.JsonOutput.toJson([providers: [
                        [type: 'ttf', file: "zas_atmos:${file}.ttf", size: size, oversample: oversample],
                        [type: 'reference', id: 'minecraft:default'],
                    ]])
                }
            }
        }
    }
}
sourceSets.main.resources.srcDir(tguiFonts)

// The full stack: dev runs here load both mods, since zas_atmos requires zas.
def zasMod = project(':zas').neoForge.mods.zas

neoForge {
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            // zas's GameTests are on this run's classpath, because these share their helpers, so
            // this run also repeats them with the content mod loaded. -Pgametests.ownOnly=true
            // leaves those out: each PR's CI does, and the Full GameTests workflow runs them nightly.
            def ownOnly = providers.gradleProperty('gametests.ownOnly').getOrElse('false').toBoolean()
            systemProperty 'neoforge.enabledGameTestNamespaces', ownOnly ? 'zas_atmos' : 'zas,zas_atmos'
            // The same heap everywhere, so a local run can't hide what CI runs out of. Chunks wait
            // in memory to be written, so a slow disk needs more of it. An OOM ends the run at once
            // rather than at CI's time limit.
            jvmArgument '-Xmx6G'
            jvmArgument '-XX:+ExitOnOutOfMemoryError'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    // Unit tests of the content mod's pure logic. Minecraft's classes are on the
    // test classpath, but the game is never bootstrapped.
    addModdingDependenciesTo(sourceSets.test)
    mods {
        zas {
            zasMod.modSourceSets.get().each { sourceSet it }
        }
        zas_atmos {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

// GameTests start from a fresh world, as in :zas: saved zones would otherwise come back.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete layout.projectDirectory.dir('run/world')
    }
}

dependencies {
    // Compile against the public API only (D-50); zas is required at runtime.
    implementation project(':zas-api')
    runtimeOnly project(':zas')
    gametestRuntimeOnly project(':zas').sourceSets.gametest.output
    // GameTests (only) may use the framework's test hooks: driving atmos ticks (tickNow), the
    // preset, ambient overrides and the published zones' pins. main stays API-only (CONT-095).
    gametestCompileOnly project(':zas')
    gametestCompileOnly project(':engine')
    // The GameTest helpers zas shares, such as TestPlayers.
    gametestCompileOnly project(':zas').sourceSets.gametest.output

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// NFR-010: -Pfuzz.seed=S replays a seed, -Pfuzz.seeds=N runs N seeds from it, as the nightly run does.
['fuzz.seed', 'fuzz.seeds', 'fuzz.ops'].each { name ->
    def value = providers.gradleProperty(name).orNull
    if (value != null) {
        neoForge.runs.gameTestServer.systemProperty "zas.$name", value
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // The shipped sounds, which tests read as files.
    systemProperty 'zas_atmos.resources', file('src/main/resources').absolutePath
    // CLIENT-007 reads both mods' compiled classes and language files, and prints what it finds.
    def zasMain = project(':zas').sourceSets.main
    inputs.files(zasMain.output.classesDirs, sourceSets.main.output.classesDirs)
    systemProperty 'zas.resources', project(':zas').file('src/main/resources').absolutePath
    systemProperty 'zas.mainClasses', zasMain.java.destinationDirectory.get().asFile.absolutePath
    systemProperty 'zas_atmos.mainClasses', sourceSets.main.java.destinationDirectory.get().asFile.absolutePath
    testLogging.exceptionFormat = 'full'
}

def compatMatrix = providers.gradleProperty('compat.matrix').getOrElse('false').toBoolean()
def fusion = providers.gradleProperty('fusion').getOrElse('false').toBoolean()

// Optional mods for dev runs come from Modrinth's maven, which only the properties below add.
if (compatMatrix || fusion) {
    repositories {
        exclusiveContent {
            forRepository {
                maven { url = 'https://api.modrinth.com/maven' }
            }
            filter { includeGroup 'maven.modrinth' }
        }
    }
}

// The compatibility matrix (NFR-025, docs/release-checklist.md). Only -Pcompat.matrix=true adds these
// mods, and only to this project's runs, so no jar and no ordinary run ever holds them. Sodium is left
// out of the GameTest server, where it isn't loaded and all its mixins are client mixins.
if (compatMatrix) {
    neoForge.runs.gameTestServer.systemProperty 'zas.compatMatrix', 'true'
    dependencies {
        ['modernfix:5.27.27+mc1.21.1', 'ferrite-core:7.0.3-neoforge', 'lithium:mc1.21.1-0.15.4-neoforge'].each {
            runtimeOnly "maven.modrinth:$it"
            gametestRuntimeOnly "maven.modrinth:$it"
        }
        runtimeOnly 'maven.modrinth:sodium:mc1.21.1-0.8.13-neoforge'
    }
}

// Connected textures (CONT-132). Only -Pfusion=true adds Fusion, to the dev client and server, to see
// the station blocks join. localRuntime is never published or put in a jar, and the GameTest server
// has its own classpath, so CI never fetches it.
if (fusion) {
    configurations {
        localRuntime
        runtimeClasspath.extendsFrom localRuntime
    }
    dependencies {
        localRuntime 'maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc1.21.1'
    }
}
